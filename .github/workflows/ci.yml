name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: npm
      - name: Fetch pinned engine
        run: npm run fetch-engine
      - name: Install
        run: npm ci
      - name: Build pinned engine
        run: npm run build:engine
      - name: Fetch pinned cards and rules
        run: npm run fetch-data
      - name: Format check (Prettier)
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck product client
        run: npm run typecheck:client
      - name: Typecheck browser tests
        run: npm run typecheck:browser
      - name: Dead code (knip)
        run: npm run knip
      - name: Build product client
        run: npm run build:client
      - name: Test
        run: npm test
      - name: Pin smoke
        run: npm run check
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:browser
      - name: Upload browser screenshots and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-screenshots
          path: |
            test-results/
            playwright-report/
          retention-days: 14
