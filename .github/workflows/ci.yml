name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Fetch pinned engine
        run: npm run fetch-engine
      - name: Install
        run: npm ci
      - name: Build pinned engine
        run: npm run build:engine
      - name: Fetch pinned cards and rules
        run: npm run fetch-data
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Pin smoke
        run: npm run check
