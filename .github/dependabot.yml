version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns:
          - "*"

# npm updates are omitted. package.json depends on netrunner-engine via
# file:./deps/netrunner-engine, which is fetched by tag and is not in the
# repo. Dependabot aborts the whole npm job when it cannot retrieve that path.
