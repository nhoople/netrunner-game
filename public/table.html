<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Netrunner test table</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #12151a;
        color: #e7ecf3;
      }
      body {
        margin: 0;
        padding: 1.25rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.25rem;
      }
      p {
        margin: 0.25rem 0;
      }
      a {
        color: #8ec5ff;
      }
      button {
        background: #243044;
        color: inherit;
        border: 1px solid #3d516e;
        border-radius: 6px;
        padding: 0.4rem 0.7rem;
        cursor: pointer;
      }
      button:hover {
        background: #2d3d56;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1.7fr) minmax(16rem, 0.7fr);
        gap: 1rem;
        margin-top: 1rem;
      }
      section {
        background: #1b212b;
        border: 1px solid #2c3644;
        border-radius: 8px;
        padding: 0.8rem;
      }
      .mat {
        margin-top: 0.75rem;
        padding: 0.65rem;
        border-radius: 10px;
      }
      .mat.corp {
        background: #101820;
        border: 1px solid #2a6f8f;
      }
      .mat.runner {
        background: #211114;
        border: 1px solid #8f3a32;
      }
      .mat.you {
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      }
      .mat h3 {
        margin: 0 0 0.45rem;
        font-size: 1rem;
      }
      .mat-strip,
      .servers,
      .rig-cards,
      .score-cards {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }
      .server-table {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        overflow-x: auto;
        padding-bottom: 0.2rem;
      }
      .rank {
        display: flex;
        gap: 0.4rem;
        align-items: stretch;
      }
      .cell {
        flex: 1 0 7.2rem;
        min-width: 7.2rem;
      }
      .cell.under-run {
        outline: 2px solid #e2b340;
        outline-offset: 2px;
        border-radius: 8px;
      }
      .ice-stack {
        display: flex;
        flex-direction: column;
        gap: 0.28rem;
        height: 100%;
      }
      .server-table.ice-up .ice-rank .ice-stack {
        justify-content: flex-end;
      }
      .slot.spacer {
        border: none;
        background: transparent;
        min-height: 0;
      }
      .server-name {
        font-size: 0.75rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #9aa8ba;
      }
      .stat {
        min-width: 4.4rem;
        padding: 0.3rem 0.45rem;
        border: 1px solid #3d516e;
        border-radius: 8px;
        text-align: center;
        background: #0f1319;
      }
      .stat.wide {
        min-width: 10rem;
        text-align: left;
      }
      .stat b {
        display: block;
        font-size: 1.05rem;
      }
      .stat span,
      .slot .where,
      .slot .meta {
        display: block;
        color: #9aa8ba;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .slot {
        position: relative;
        border: 1px dashed #3d516e;
        border-radius: 8px;
        min-height: 4.2rem;
        padding: 0.3rem;
        background: rgba(0, 0, 0, 0.18);
      }
      .slot.filled {
        border-style: solid;
      }
      .slot.sleeve {
        border-style: solid;
        border-color: #5c6b80;
        background: #1a2330;
      }
      .slot.rezzed {
        border-color: #7dcea0;
      }
      .slot .name {
        font-size: 0.84rem;
      }
      .slot .credits {
        position: absolute;
        top: 0.28rem;
        left: 0.28rem;
        min-width: 1.35rem;
        height: 1.35rem;
        padding: 0 0.28rem;
        border-radius: 999px;
        background: #7dcea0;
        color: #102018;
        font-size: 0.8rem;
        font-weight: 700;
        line-height: 1.35rem;
        text-align: center;
      }
      .slot .adv {
        position: absolute;
        top: 0.28rem;
        right: 0.28rem;
        min-width: 1.35rem;
        height: 1.35rem;
        padding: 0 0.28rem;
        border-radius: 999px;
        background: #e2b340;
        color: #1a1408;
        font-size: 0.8rem;
        font-weight: 700;
        line-height: 1.35rem;
        text-align: center;
      }
      .slot img {
        display: block;
        width: 72px;
        height: auto;
        border-radius: 4px;
        margin-bottom: 0.25rem;
      }
      .pile-face + .pile-face {
        margin-top: 0.45rem;
      }
      .rig-row {
        display: flex;
        gap: 0.45rem;
        align-items: stretch;
        margin-top: 0.35rem;
      }
      .rig-row h4 {
        width: 5.6rem;
        margin: 0;
        align-self: center;
        font-size: 0.85rem;
      }
      .rig-cards {
        flex: 1;
      }
      .accessing h3 {
        margin: 0.4rem 0;
      }
      .timing {
        margin: 0 0 0.75rem;
        padding: 0.6rem 0.75rem;
        background: #1b2433;
        border: 1px solid #3d516e;
        border-radius: 8px;
      }
      .timing-step {
        margin: 0;
        font-size: 1.05rem;
      }
      .timing-priority {
        margin: 0.2rem 0 0;
        color: #9aa8ba;
      }
      .cite {
        color: #9aa8ba;
        font-size: 0.75rem;
      }
      .play-choice {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.15rem;
      }
      .log .cite {
        margin-left: 0.35rem;
      }
      .hand,
      .actions,
      .log,
      .chat-log {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        margin: 0.5rem 0;
      }
      .hand {
        flex-direction: row;
        flex-wrap: wrap;
        align-items: flex-start;
      }
      .hand li {
        width: 180px;
        list-style: none;
      }
      .log,
      .chat-log {
        max-height: 16rem;
        overflow: auto;
        font-size: 0.9rem;
      }
      form.chat {
        display: flex;
        gap: 0.4rem;
      }
      input {
        flex: 1;
        background: #0f1319;
        color: inherit;
        border: 1px solid #3d516e;
        border-radius: 6px;
        padding: 0.4rem 0.6rem;
      }
      .muted {
        color: #9aa8ba;
      }
      .hand li img {
        display: block;
        width: 180px;
        height: auto;
        border-radius: 8px;
        margin-bottom: 0.35rem;
      }
      .hand li .rules {
        color: #c5d0de;
        font-size: 0.92rem;
        margin-top: 0.1rem;
      }
      .play-group h4,
      .play-card {
        margin: 0.55rem 0 0.2rem;
        font-size: 0.78rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #9aa8ba;
      }
      .play-card {
        text-transform: none;
        letter-spacing: 0;
        font-size: 0.85rem;
        color: #e2b08a;
      }
      .play-buttons {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      .play-buttons button.card-ability {
        background: #2a2118;
        border-color: #c47b4a;
      }
      .play-buttons button.card-ability:hover {
        background: #3a2c20;
      }
      .error {
        color: #ffb4b4;
      }
      @media (max-width: 800px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <h1>Netrunner test table</h1>
    <p class="muted" id="status">Create a match, then open each seat link.</p>
    <div id="lobby"></div>
    <div id="table" hidden>
      <p id="seat"></p>
      <div class="layout">
        <section>
          <h2>Seat</h2>
          <div id="board"></div>
          <h3 id="hand-heading">Hand</h3>
          <ul class="hand" id="hand"></ul>
          <h3 id="plays-heading">Legal plays</h3>
          <p class="muted" id="legal-note"></p>
          <div class="actions" id="actions"></div>
          <button id="concede" type="button">Concede</button>
        </section>
        <section>
          <h2>Game log</h2>
          <div class="log" id="log"></div>
          <h2>Table chat</h2>
          <p class="muted" id="chat-note">Talk stays on this page. A Discord thread can mirror it later. Spectators have a separate room.</p>
          <div class="chat-log" id="chat"></div>
          <form class="chat" id="chat-form">
            <input id="chat-text" maxlength="500" placeholder="Message the other seat" />
            <button type="submit">Send</button>
          </form>
          <p class="error" id="error"></p>
        </section>
      </div>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const token = params.get("token");
      const lobby = document.querySelector("#lobby");
      const table = document.querySelector("#table");
      const status = document.querySelector("#status");
      const errorEl = document.querySelector("#error");

      function link(seatToken) {
        const url = new URL(location.href);
        url.search = "";
        url.searchParams.set("token", seatToken);
        return url.toString();
      }

      if (!token) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "Create learn-to-play match";
        button.addEventListener("click", async () => {
          button.disabled = true;
          const res = await fetch("/matches", { method: "POST" });
          const body = await res.json();
          lobby.replaceChildren();
          const note = document.createElement("p");
          note.textContent = "Open Corp and Runner in two browsers. The spectator link watches with both hands hidden.";
          const list = document.createElement("ul");
          for (const seat of ["corp", "runner", "spectator"]) {
            const item = document.createElement("li");
            const anchor = document.createElement("a");
            anchor.href = link(body.seats[seat]);
            anchor.textContent = seat;
            item.append(anchor);
            list.append(item);
          }
          lobby.append(note, list);
        });
        lobby.append(button);
      } else {
        table.hidden = false;
        let you = "";
        const socket = new WebSocket(
          `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/?token=${encodeURIComponent(token)}`,
        );
        socket.addEventListener("message", (event) => {
          const message = JSON.parse(event.data);
          if (message.type === "error") {
            errorEl.textContent = message.message;
            return;
          }
          if (message.type === "welcome") {
            you = message.seat;
            status.textContent = `Match ${message.matchId}`;
            document.querySelector("#seat").textContent = you === "spectator" ? "You are watching" : `You are ${you}`;
            if (you === "spectator") {
              document.querySelector("#concede").hidden = true;
              document.querySelector("#chat-text").placeholder = "Message other spectators";
              document.querySelector("#chat-note").textContent = "You can read table chat. Messages you send stay with spectators.";
            }
            return;
          }
          if (message.type === "chat") {
            appendChat(message.line);
            return;
          }
          if (message.type === "snapshot") render(message);
        });

        document.querySelector("#concede").addEventListener("click", () => {
          socket.send(JSON.stringify({ v: 1, type: "concede" }));
        });
        document.querySelector("#chat-form").addEventListener("submit", (event) => {
          event.preventDefault();
          const input = document.querySelector("#chat-text");
          const text = input.value;
          if (!text.trim()) return;
          socket.send(JSON.stringify({ v: 1, type: "chat", room: you === "spectator" ? "spectator" : "table", text }));
          input.value = "";
        });

        function printedFace(card) {
          const item = document.createElement("li");
          const name = document.createElement("div");
          name.textContent = card.cost ? `${card.title} — ${card.type}, ${card.cost}` : `${card.title} — ${card.type}`;
          if (card.code) {
            const img = document.createElement("img");
            img.alt = card.title;
            img.src = `/img/cards/${encodeURIComponent(card.code)}.jpg`;
            img.addEventListener("error", () => img.remove());
            item.append(img);
          }
          item.append(name);
          if (card.text) {
            const rules = document.createElement("div");
            rules.className = "rules";
            rules.textContent = card.text;
            item.append(rules);
          }
          return item;
        }

        function cardFace(snapshot, id) {
          const card = snapshot.glossary?.[id];
          if (!card) {
            const item = document.createElement("li");
            const name = document.createElement("div");
            name.textContent = id ?? "card";
            item.append(name);
            return item;
          }
          return printedFace(card);
        }

        function el(tag, className, text) {
          const node = document.createElement(tag);
          if (className) node.className = className;
          if (text != null) node.textContent = text;
          return node;
        }

        function titleOf(snapshot, id) {
          return snapshot.glossary?.[id]?.title ?? null;
        }

        function typeOf(snapshot, id) {
          return snapshot.glossary?.[id]?.type ?? null;
        }

        function serverName(id) {
          if (id === "hq") return "HQ";
          if (id === "rd") return "R&D";
          if (id === "archives") return "Archives";
          if (typeof id === "string" && id.startsWith("remote-")) return `Remote ${id.slice("remote-".length)}`;
          return String(id ?? "server");
        }

        function serverRank(id) {
          if (id === "hq") return 0;
          if (id === "rd") return 1;
          if (id === "archives") return 2;
          const n = Number(String(id).slice("remote-".length));
          return 10 + (Number.isFinite(n) ? n : 0);
        }

        function stat(label, value) {
          const box = el("div", "stat");
          box.append(el("b", "", String(value)));
          box.append(el("span", "", label));
          return box;
        }

        function backImage(side, alt) {
          const img = document.createElement("img");
          img.className = "back";
          img.alt = alt;
          img.src = side === "runner" ? "/backs/runner.png" : "/backs/corp.png";
          return img;
        }

        function cardSlot(snapshot, card, fallback) {
          const slot = el("div", "slot");
          if (!card) {
            slot.classList.add("empty");
            slot.append(el("span", "where", fallback));
            slot.append(el("div", "name", "empty"));
            return slot;
          }
          const hidden = !card.title;
          slot.classList.add(hidden ? "sleeve" : "filled");
          if (card.rezzed) slot.classList.add("rezzed");
          const known = !hidden && card.id ? snapshot.glossary?.[card.id] : null;
          const code = known?.code ?? (!hidden ? card.code : null);
          if (code) {
            const img = document.createElement("img");
            img.alt = known?.title ?? card.title;
            img.src = `/img/cards/${encodeURIComponent(code)}.jpg`;
            img.addEventListener("error", () => img.remove());
            slot.append(img);
          }
          const hiddenName = fallback === "Card" ? "Unrezzed card" : fallback.replace(/^Ice/, "Unrezzed ice");
          if (hidden) slot.append(backImage(card.side === "runner" ? "runner" : "corp", hiddenName));
          slot.append(el("div", "name", hidden ? hiddenName : card.title));
          if (card.advancementTokens) {
            const badge = el("div", "adv", String(card.advancementTokens));
            badge.title = card.advancementTokens === 1
              ? "1 advancement counter"
              : `${card.advancementTokens} advancement counters`;
            slot.append(badge);
          }
          const hosted = card.hosted ?? known?.hosted;
          if (hosted) {
            const badge = el("div", "credits", `${hosted}¢`);
            badge.title = hosted === 1 ? "1 credit on this card" : `${hosted} credits on this card`;
            slot.append(badge);
          }
          const bits = [];
          if (!hidden && card.rezzed === false) bits.push("unrezzed");
          if (!hidden && card.rezzed === true) bits.push("rezzed");
          if (!hidden && card.strength != null) bits.push(`str ${card.strength}`);
          if (!hidden && card.type) bits.push(card.type);
          if (bits.length) slot.append(el("div", "meta", bits.join(" · ")));
          return slot;
        }

        function pileSlot(label, lines) {
          const slot = el("div", "slot pile");
          slot.append(el("span", "where", label));
          if (!lines.length) {
            slot.classList.add("empty");
            slot.append(el("div", "name", "empty"));
            return slot;
          }
          slot.classList.add("filled");
          for (const line of lines) slot.append(el("div", "name", line));
          return slot;
        }

        function hiddenPile(label, count, side) {
          const slot = el("div", "slot pile");
          slot.append(el("span", "where", label));
          if (!count) {
            slot.classList.add("empty");
            slot.append(el("div", "name", "empty"));
            return slot;
          }
          slot.classList.add("sleeve");
          slot.append(backImage(side, label));
          slot.append(el("div", "name", count === 1 ? "1 card" : `${count} cards`));
          return slot;
        }

        function faceImage(card) {
          if (!card?.code) return null;
          const img = document.createElement("img");
          img.alt = card.title;
          img.src = `/img/cards/${encodeURIComponent(card.code)}.jpg`;
          img.addEventListener("error", () => img.remove());
          return img;
        }

        function topCardPile(snapshot, label, top, side) {
          const slot = el("div", "slot pile");
          slot.append(el("span", "where", label));
          if (!top) {
            slot.classList.add("empty");
            slot.append(el("div", "name", "empty"));
            return slot;
          }
          if (!top.faceup) {
            slot.classList.add("sleeve");
            slot.append(backImage(side, "Facedown card"));
            return slot;
          }
          slot.classList.add("filled");
          const card = snapshot.glossary?.[top.id];
          const img = faceImage(card);
          if (img) slot.append(img);
          slot.append(el("div", "name", card?.title ?? "card"));
          return slot;
        }

        function rigId(entry) {
          return typeof entry === "string" ? entry : entry?.id;
        }

        function idSlot(snapshot, id, fallback, hosted) {
          const card = snapshot.glossary?.[id];
          const credits = hosted ?? card?.hosted;
          if (!card) return cardSlot(snapshot, { id, title: null, hosted: credits }, fallback);
          return cardSlot(snapshot, { id, title: card.title, type: card.type, hosted: credits }, fallback);
        }

        function identityCard(snapshot, pile) {
          const id = pile.identityId && snapshot.glossary?.[pile.identityId]
            ? pile.identityId
            : Object.entries(snapshot.glossary ?? {}).find(([, card]) => card.type === "identity" && card.title === pile.identity)?.[0];
          return id ? idSlot(snapshot, id, "Identity") : cardSlot(snapshot, null, "Identity");
        }

        function fillBoard(snapshot) {
          const view = snapshot.view ?? {};
          const board = document.querySelector("#board");
          board.replaceChildren();
          board.append(timingBanner(snapshot));
          if (snapshot.result?.done) {
            board.append(el("p", "", `Game over. Winner: ${snapshot.result.winner ?? "none"} ${snapshot.result.hostEnd ?? snapshot.result.winReason ?? ""}`));
          }
          if (view.run?.attackedServerId) {
            const phase = view.run.phase ? ` · ${view.run.phase}` : "";
            board.append(el("p", "", `Run on ${serverName(view.run.attackedServerId)}${phase}`));
          }
          const liveId = view.run?.accessingCardId;
          const live = liveId ? snapshot.glossary?.[liveId] : null;
          const accessed = live ?? snapshot.access ?? null;
          if (accessed) {
            const accessing = el("div", "accessing");
            accessing.append(el("h3", "", "Accessing"));
            const list = el("ul", "hand");
            list.append(live ? cardFace(snapshot, liveId) : printedFace(accessed));
            accessing.append(list);
            board.append(accessing);
          }
          const servers = view.servers ?? [];
          if (!view.self) {
            board.append(corpMat(snapshot, view.corp ?? {}, servers, { you: false, iceToward: "up" }));
            board.append(runnerMat(snapshot, view.runner ?? {}, { you: false }));
            return;
          }
          if (snapshot.viewer === "corp") {
            board.append(runnerMat(snapshot, view.opponent ?? {}, { you: false }));
            board.append(corpMat(snapshot, view.self ?? {}, servers, { you: true, iceToward: "up" }));
          } else {
            board.append(corpMat(snapshot, view.opponent ?? {}, servers, { you: false, iceToward: "down" }));
            board.append(runnerMat(snapshot, view.self ?? {}, { you: true }));
          }
        }

        function corpMat(snapshot, pile, servers, options) {
          const mat = el("div", `mat corp${options.you ? " you" : ""}`);
          mat.append(el("h3", "", options.you ? "Corp (you)" : "Corp"));
          const strip = el("div", "mat-strip");
          strip.append(
            identityCard(snapshot, pile),
            stat("Score", pile.scorePoints ?? pile.scoreCount ?? 0),
            stat("Credits", pile.credits ?? 0),
            stat("Clicks", pile.clicks ?? 0),
            stat("Bad publicity", snapshot.view?.badPublicity ?? pile.badPublicity ?? 0),
          );
          const score = el("div", "score-cards");
          for (const entry of pile.score ?? []) {
            score.append(typeof entry === "string" && snapshot.glossary?.[entry]
              ? idSlot(snapshot, entry, "Agenda")
              : cardSlot(snapshot, {
                  title: typeof entry === "string" ? entry : entry?.title,
                  type: entry?.type,
                  code: entry?.code,
                  rezzed: entry?.rezzed,
                }, "Agenda"));
          }
          if (!(pile.score ?? []).length) score.append(pileSlot("Score area", []));
          strip.append(score);
          const row = el("div", `server-table ice-${options.iceToward}`);
          const ordered = [...servers].sort((a, b) => serverRank(a.id) - serverRank(b.id));
          const names = el("div", "rank");
          const faces = el("div", "rank");
          const roots = el("div", "rank");
          const ice = el("div", "rank ice-rank");
          for (const server of ordered) {
            const marked = snapshot.view?.run?.attackedServerId === server.id ? " under-run" : "";
            names.append(el("div", `cell server-name${marked}`, serverName(server.id)));
            faces.append(wrapCell(serverFace(snapshot, server, pile, options.you), marked));
            roots.append(wrapCell(serverRoot(snapshot, server), marked));
            ice.append(wrapCell(serverIce(snapshot, server, options.iceToward), marked));
          }
          const ranks = options.iceToward === "up" ? [ice, roots, faces, names] : [names, faces, roots, ice];
          row.append(...ranks);
          if (options.iceToward === "down") mat.append(strip, row);
          else mat.append(row, strip);
          return mat;
        }

        function wrapCell(node, marked) {
          const cell = el("div", `cell${marked}`);
          cell.append(node);
          return cell;
        }

        function serverIce(snapshot, server, iceToward) {
          const stack = el("div", "ice-stack");
          const cards = server.ice ?? [];
          const nodes = cards.length
            ? cards.map((card, index, all) => {
                const place = all.length === 1 ? "Ice" : index === 0 ? "Ice · outermost" : index === all.length - 1 ? "Ice · innermost" : "Ice";
                return cardSlot(snapshot, card, place);
              })
            : [cardSlot(snapshot, null, "Ice")];
          for (const node of iceToward === "up" ? nodes : [...nodes].reverse()) stack.append(node);
          return stack;
        }

        function serverRoot(snapshot, server) {
          const central = server.id === "hq" || server.id === "rd" || server.id === "archives";
          if (!central) return el("div", "slot spacer");
          const cards = server.root ?? [];
          if (!cards.length) return cardSlot(snapshot, null, "Root");
          const stack = el("div", "ice-stack");
          for (const card of cards) stack.append(cardSlot(snapshot, card, "Card"));
          return stack;
        }

        function serverFace(snapshot, server, pile, you) {
          if (server.id === "hq" || server.id === "rd" || server.id === "archives") {
            return centralPile(snapshot, server, pile, you);
          }
          const cards = server.root ?? [];
          if (!cards.length) return pileSlot(serverName(server.id), []);
          const stack = el("div", "ice-stack");
          for (const card of cards) stack.append(cardSlot(snapshot, card, "Card"));
          return stack;
        }

        function centralPile(snapshot, server, pile, you) {
          if (server.id === "hq") {
            const n = you ? (pile.hand?.length ?? pile.handCount ?? 0) : (pile.handCount ?? 0);
            if (!you) return hiddenPile("HQ", n, "corp");
            return pileSlot("HQ", [`${n} in hand, listed below`]);
          }
          if (server.id === "rd") return hiddenPile("R&D", pile.deckCount ?? 0, "corp");
          return topCardPile(snapshot, "Archives", pile.discardTop, "corp");
        }

        function runnerMat(snapshot, pile, options) {
          const mat = el("div", `mat runner${options.you ? " you" : ""}`);
          mat.append(el("h3", "", options.you ? "Runner (you)" : "Runner"));
          const strip = el("div", "mat-strip");
          const tags = pile.tags ?? 0;
          strip.append(
            identityCard(snapshot, pile),
            stat("Credits", pile.credits ?? 0),
            stat("Clicks", pile.clicks ?? 0),
            stat(tags === 1 ? "Tag" : "Tags", tags),
            stat("Link", pile.link ?? 0),
            stat("Score", pile.scorePoints ?? pile.scoreCount ?? 0),
          );
          mat.append(strip);
          const rig = el("div", "rig");
          for (const [type, label] of [["program", "Programs"], ["hardware", "Hardware"], ["resource", "Resources"]]) {
            const row = el("div", "rig-row");
            row.append(el("h4", "", label));
            const cards = el("div", "rig-cards");
            const entries = (pile.rig ?? []).filter((entry) => {
              if (typeof entry === "string") return typeOf(snapshot, entry) === type;
              if (entry?.type) return entry.type === type;
              return typeOf(snapshot, entry?.id) === type;
            });
            if (!entries.length) cards.append(cardSlot(snapshot, null, label));
            for (const entry of entries) {
              if (typeof entry === "string" || entry?.id) {
                cards.append(idSlot(snapshot, rigId(entry), label, entry?.hosted));
              } else {
                cards.append(cardSlot(snapshot, {
                  title: entry.title,
                  type: entry.type,
                  strength: entry.strength,
                  code: entry.code,
                  hosted: entry.hosted,
                }, label));
              }
            }
            row.append(cards);
            rig.append(row);
          }
          mat.append(rig);
          const piles = el("div", "mat-strip");
          const grip = options.you ? (pile.hand?.length ?? pile.handCount ?? 0) : (pile.handCount ?? 0);
          const scoreLines = (pile.score ?? []).map((entry) =>
            typeof entry === "string" ? (titleOf(snapshot, entry) ?? entry) : (entry?.title ?? "agenda"),
          );
          piles.append(
            options.you ? pileSlot("Grip", [`${grip} in hand, listed below`]) : hiddenPile("Grip", grip, "runner"),
            hiddenPile("Stack", pile.deckCount ?? 0, "runner"),
            topCardPile(snapshot, "Heap", pile.discardTop, "runner"),
            pileSlot("Score area", scoreLines),
          );
          mat.append(piles);
          return mat;
        }

        function citeLinks(cites) {
          if (!cites?.length) return null;
          const span = el("span", "cite");
          span.append(document.createTextNode("CR "));
          cites.forEach((cite, index) => {
            if (index) span.append(document.createTextNode(", "));
            const anchor = document.createElement("a");
            anchor.href = `https://rules.nullsignal.games/?r=${encodeURIComponent(cite.id)}`;
            anchor.target = "_blank";
            anchor.rel = "noopener";
            anchor.textContent = cite.number;
            anchor.addEventListener("click", (event) => event.stopPropagation());
            span.append(anchor);
          });
          return span;
        }

        function timingBanner(snapshot) {
          const timing = snapshot.timing;
          const view = snapshot.view ?? {};
          const box = el("div", "timing");
          box.append(el("p", "timing-step", timing ? `${timing.stepNumber} — ${timing.label}` : "Waiting for the timing step"));
          const turn = `Turn ${view.turnNumber ?? "?"}`;
          const side = view.activeSide === "runner" ? "Runner's turn" : view.activeSide === "corp" ? "Corp's turn" : "";
          const holder = timing?.priority === "corp"
            ? "Corp has priority"
            : timing?.priority === "runner"
              ? "Runner has priority"
              : timing?.priority === "system"
                ? "The game is resolving this step"
                : "";
          const window = timing?.kind === "pass" ? "Priority window" : "";
          box.append(el("p", "timing-priority", [turn, side, window, holder].filter(Boolean).join(" · ")));
          return box;
        }

        function playButton(snapshot, choice) {
          const wrap = el("div", "play-choice");
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = choice.label;
          if (choice.source === "card") button.className = "card-ability";
          const described = snapshot.glossary?.[choice.intent?.cardId] ?? snapshot.glossary?.[choice.intent?.breakerId];
          if (described?.text) button.title = described.text;
          button.addEventListener("click", () => {
            socket.send(
              JSON.stringify({
                v: 1,
                type: "intent",
                intentId: crypto.randomUUID(),
                intent: choice.intent,
              }),
            );
          });
          wrap.append(button);
          const cites = citeLinks(choice.cites);
          if (cites) wrap.append(cites);
          return wrap;
        }

        function appendPlayGroup(parent, title, choices, snapshot) {
          if (!choices.length) return;
          parent.append(el("h4", "", title));
          if (title !== "Card abilities") {
            const box = el("div", "play-buttons");
            for (const choice of choices) box.append(playButton(snapshot, choice));
            parent.append(box);
            return;
          }
          const named = new Map();
          const loose = [];
          for (const choice of choices) {
            if (!choice.card) {
              loose.push(choice);
              continue;
            }
            const group = named.get(choice.card) ?? [];
            group.push(choice);
            named.set(choice.card, group);
          }
          for (const [card, group] of named) {
            parent.append(el("div", "play-card", card));
            const box = el("div", "play-buttons");
            for (const choice of group) box.append(playButton(snapshot, choice));
            parent.append(box);
          }
          if (loose.length) {
            const box = el("div", "play-buttons");
            for (const choice of loose) box.append(playButton(snapshot, choice));
            parent.append(box);
          }
        }

        function render(snapshot) {
          errorEl.textContent = "";
          const view = snapshot.view ?? {};
          const self = view.self ?? {};
          fillBoard(snapshot);
          const handHeading = document.querySelector("#hand-heading");
          const watching = snapshot.viewer === "spectator";
          const liveId = view.run?.accessingCardId;
          const live = liveId ? snapshot.glossary?.[liveId] : null;
          const accessed = live ?? snapshot.access ?? null;
          handHeading.textContent = accessed
            ? "Accessing"
            : watching
              ? "Hands"
              : snapshot.viewer === "corp"
                ? "HQ"
                : "Grip";
          const hand = document.querySelector("#hand");
          hand.replaceChildren();
          if (accessed) hand.append(live ? cardFace(snapshot, liveId) : printedFace(accessed));
          if (watching) {
            const item = document.createElement("li");
            item.textContent = "Hidden. HQ and the grip stay with their seats.";
            hand.append(item);
          } else {
            for (const id of self.hand ?? []) hand.append(cardFace(snapshot, id));
            if (!accessed && (self.hand ?? []).length === 0) {
              const item = document.createElement("li");
              item.textContent = "(empty)";
              hand.append(item);
            }
          }
          const legal = snapshot.legal ?? [];
          const heading = document.querySelector("#plays-heading");
          const note = document.querySelector("#legal-note");
          const timing = view.timingKey ?? "";
          const openingSeat = timing === "opening.corpMulligan"
            ? "corp"
            : timing === "opening.runnerMulligan"
              ? "runner"
              : null;
          if (watching) {
            heading.textContent = "Watching";
            note.textContent = "Plays stay with the seats.";
          } else if (openingSeat) {
            heading.textContent = "Starting hand";
            const who = openingSeat === "corp" ? "Corp" : "Runner";
            note.textContent = openingSeat === snapshot.viewer
              ? "Keep this hand, or mulligan once. A mulligan shuffles these cards back into the deck and draws 5. That hand stays."
              : `${who} is choosing whether to keep their starting hand.`;
          } else {
            heading.textContent = "Legal plays";
            note.textContent = legal.length
              ? "Basic actions are the standard clicks and rules steps. Card abilities are printed on a card. The amount after the dash is what you spend."
              : "No legal plays from this seat right now.";
          }
          const actions = document.querySelector("#actions");
          actions.replaceChildren();
          appendPlayGroup(actions, "Basic actions", legal.filter((choice) => choice.source !== "card"), snapshot);
          appendPlayGroup(actions, "Card abilities", legal.filter((choice) => choice.source === "card"), snapshot);
          const log = document.querySelector("#log");
          log.replaceChildren();
          for (const entry of snapshot.log ?? []) {
            const p = document.createElement("p");
            p.append(document.createTextNode(`${entry.seq}. ${entry.summary}`));
            const cites = citeLinks(entry.cites);
            if (cites) p.append(cites);
            log.append(p);
          }
          const chat = document.querySelector("#chat");
          chat.replaceChildren();
          for (const line of snapshot.chat ?? []) appendChat(line);
        }

        function appendChat(line) {
          const chat = document.querySelector("#chat");
          const p = document.createElement("p");
          p.textContent = `${line.from}: ${line.text}`;
          chat.append(p);
        }
      }
    </script>
  </body>
</html>
